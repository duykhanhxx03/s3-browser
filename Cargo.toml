[workspace]
resolver = "2"
members = ["crates/app", "crates/s3core", "crates/transfer", "crates/vault", "crates/gpui_tokio"]
exclude = ["vendor/gpui"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui_tokio = { path = "crates/gpui_tokio" }
s3core = { path = "crates/s3core" }
transfer = { path = "crates/transfer" }
vault = { path = "crates/vault" }

anyhow = "1"
time = { version = "0.3", features = ["local-offset"] }
opener = "0.7"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }

aws-config = { version = "1", features = ["behavior-version-latest", "sso"] }
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
aws-sdk-sso = "1"
aws-sdk-ssooidc = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }

[profile.dev]
# GPUI is heavy; optimize dependencies so debug builds stay usable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
gpui = { path = "vendor/gpui" }
