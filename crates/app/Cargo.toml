[package]
name = "s3browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "s3browser"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui_tokio.workspace = true
s3core.workspace = true
transfer.workspace = true
vault.workspace = true
anyhow.workspace = true
opener.workspace = true
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Used by the `--verify-glass` self-check to inspect the real NSWindow.
# Versions match what gpui 0.2.2 already links.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSApplication", "NSVisualEffectView", "NSColor", "NSGraphics", "NSWorkspace"] }
objc2-foundation = "0.3"

# Packaging. `cargo packager --release -p s3browser` builds the .app and .dmg.
#
# This lives here rather than in the workspace root because the root is a
# virtual manifest — `[package.metadata]` there is silently ignored, which looks
# exactly like a config that does nothing.
#
# Signing and notarisation are deliberately absent: both need a Developer ID
# Application certificate from the paid Apple Developer Program, which no config
# file can supply. See docs/PACKAGING.md for the steps and for what a user sees
# when they are missing.
[package.metadata.packager]
product-name = "S3 Browser"
identifier = "dev.s3browser.app"
description = "Desktop S3 browser"
authors = ["s3browser"]
formats = ["app", "dmg"]
icons = [
  "../../assets/brand/s3-browser.icns",
  "assets/brand/s3-browser.icns",
]

[package.metadata.packager.macos]
# 12.0 is where NSVisualEffectView vibrancy behaves the way the glass UI needs.
minimum-system-version = "12.0"
